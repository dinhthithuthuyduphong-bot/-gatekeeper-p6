# Numerical checks of the corrected theory of the FSE draft (docs/paper/THEORY.md).  No model calls, 0 USD.
# Commits research_closure/results/theory/THEORY_CHECKS.{json,md}.
name: Gatekeeper theory checks
on:
  workflow_dispatch:
    inputs:
      reps: {description: "Monte Carlo repetitions for C1/C2", default: "2000"}
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_theory_checks -v
      - run: |
          python tools/theory_checks.py out_theory --reps "${{ inputs.reps }}" --cells 10 --n 300 --seed 7
          cat out_theory/THEORY_CHECKS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: THEORY_CHECKS
          path: out_theory
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_closure/results/theory
          cp out_theory/* research_closure/results/theory/
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_closure/results/theory
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Theory checks (reps ${{ inputs.reps }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
