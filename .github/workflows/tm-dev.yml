# Study L2 DEVELOPMENT run (0 cost): test-level differential on the six exposed instances.
# Not a frozen study and not evidence; it only measures whether the mechanism is feasible.
name: Gatekeeper test-mutation development check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  tm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: D1_py_ecc
            python: "3.12"
            os: ubuntu-24.04
          - target: D2_cerberus
            python: "3.8"
            os: ubuntu-22.04
          - target: D3_speckit
            python: "3.12"
            os: ubuntu-24.04
          - target: D4_openfeature
            python: "3.12"
            os: ubuntu-24.04
          - target: D5_pycubrid
            python: "3.12"
            os: ubuntu-24.04
          - target: A1_speckit_catalog
            python: "3.12"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_tm
          python tools/tm_check.py ${{ matrix.target }} out_tm 2>&1 | tee out_tm/log_${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: TM_${{ matrix.target }}
          path: out_tm
