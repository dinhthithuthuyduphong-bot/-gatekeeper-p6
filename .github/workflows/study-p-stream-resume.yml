# Study P confirmatory cohort, STREAMING (study_p/STUDY_P_PROTOCOL.md): each candidate goes straight through vetting,
# the function-level oracle (generator written once and hashed) and patch generation with scoring, in parallel shards.
# Refuses unless study_p is FROZEN and verifies, every candidate is in the A* track, and the required files exist.
# Money: Free Trial credit (Vertex), expected about 16 USD for the whole cohort; HTTP 429 is retried with backoff.
name: Gatekeeper Study P stream resume (amendment P-A2)
on:
  workflow_dispatch:
    inputs:
      shards: {description: "number of parallel shards (at most 256)", default: "200"}
      only_shards: {description: "REQUIRED: comma-separated shards whose job died (e.g. 151,181)", required: true}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Freeze check
        run: |
          python -c "import json,sys;c=json.load(open('study_p/config_study_p.json'));sys.exit(0 if c.get('status')=='FROZEN' else 'study_p is not FROZEN')"
          python tools/freeze_study.py verify study_p
      - name: Required files and guards
        shell: bash
        run: |
          set -euo pipefail
          for f in tools/p_stream.py tools/p_stream_resume.py tools/vet_target2.py tools/fn_probe_llm.py tools/fn_probe.py tools/fn_probe_inner.py tools/cohort_instance.py tools/cohort_inner.py gatekeeper_ext/fn_draws.py gatekeeper_ext/gates.py gatekeeper_ext/fn_llm_gen.py gatekeeper_ext/fn_inputs.py research_closure/pilot/models.json study_p/candidates_astar.json; do
            [ -f "$f" ] || { echo "::error::MISSING $f"; exit 1; }
          done
          python tools/repo_hygiene.py
          python tools/check_track.py study_p/candidates_astar.json ASTAR
          [ -f research_closure/results/p_stream/DONE.json ] || { echo "::error::the list of candidates already processed is missing"; exit 1; }
          python -c "import json,sys;c=json.load(open('study_p/config_study_p.json'));sys.exit(0 if 'P-A2' in c.get('amendments_applied',[]) else 'amendment P-A2 is not applied')"
      - id: m
        env:
          SHARDS: ${{ inputs.shards }}
          ONLY: ${{ inputs.only_shards }}
        run: |
          python - <<'PY'
          import json, os
          k = int(os.environ['SHARDS'])
          assert 1 <= k <= 256
          only = [int(x) for x in os.environ.get('ONLY', '').replace(' ', '').split(',') if x]
          assert all(0 <= x < k for x in only)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('matrix=' + json.dumps({'shard': only or list(range(k))}) + '\n')
          PY
  stream:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Google Cloud auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        run: |
          t="$(gcloud auth print-access-token)"; echo "::add-mask::$t"; echo "GOOGLE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
          pip install -q google-auth requests
          echo "GK_TOKEN_CMD=python $GITHUB_WORKSPACE/tools/fresh_gcp_token.py" >> "$GITHUB_ENV"
      - name: Stream one shard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          mkdir -p out_s
          python -u tools/p_stream_resume.py study_p/candidates_astar.json out_s "$SHARD" "$SHARDS" research_closure/pilot/models.json research_closure/results/p_stream/DONE.json 2>&1 | tee out_s/log_shard.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: P_STREAM_RESUME_${{ matrix.shard }}
          path: out_s
