# Continuous integration: runs on every push to main and to the working branches (claude/**) and on every pull request.
# Rule (docs/PAPER_TODO.md, 3b): results are evaluated from THIS log, not from local runs; the full output is kept as artifact CI_LOG.
# Fast and free: unit tests, workflow lint, the paper's quoted numbers, and the freeze of every study the paper cites.
name: Gatekeeper CI
on:
  push:
    branches: [main, "claude/**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci_log
          python -m unittest discover -s tests 2>&1 | tee ci_log/unit_tests.txt
      - name: Workflow lint (actionlint; shellcheck off, several workflows embed large payloads)
        run: |
          pip install -q actionlint-py
          actionlint -oneline -shellcheck= -pyflakes=
      - name: Numbers quoted in the paper
        shell: bash
        run: |
          set -o pipefail
          python tools/check_paper_numbers.py 2>&1 | tee ci_log/paper_numbers.txt
      - name: Freeze of every cited study
        shell: bash
        run: |
          set -euo pipefail
          for s in study_d study_e study_g study_h study_q; do python tools/freeze_study.py verify $s | tee -a ci_log/freeze.txt; done
          git worktree add -q /tmp/p_freeze 6437ecf
          (cd /tmp/p_freeze && python tools/freeze_study.py verify study_p) | tee -a ci_log/freeze.txt
      - name: Result files come from Actions (rule 3d)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          bad=0
          for c in $(git rev-list "$BEFORE..$GITHUB_SHA" -- research_closure/results 2>/dev/null || true); do
            author=$(git log -1 --format=%an "$c")
            [ "$author" = "gatekeeper-freeze-bot" ] && continue
            # content changes only: additions, modifications, deletions, renames with edits (pure renames R100 are allowed)
            changed=$(git show --format= --name-status -M100% "$c" -- research_closure/results | grep -Ev '^R100' || true)
            if [ -n "$changed" ]; then
              echo "::error::commit ${c::7} by $author changes result files outside a workflow:"; echo "$changed"; bad=1
            fi
          done
          echo "| Result files from Actions only | $([ $bad = 0 ] && echo OK || echo VIOLATION) |" >> ci_log/provenance.txt
          exit $bad
      - name: Evaluation summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Gatekeeper CI evaluation (commit ${GITHUB_SHA::7}, ref ${GITHUB_REF_NAME})"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Unit tests | $(grep -E '^(Ran|OK|FAILED)' ci_log/unit_tests.txt 2>/dev/null | tr '\n' ' ') |"
            echo "| Paper numbers | $(tail -1 ci_log/paper_numbers.txt 2>/dev/null) |"
            cat ci_log/provenance.txt 2>/dev/null || true
            echo "| Freeze verifications | $(grep -ci 'ok\|verified' ci_log/freeze.txt 2>/dev/null) lines OK, $(grep -ci 'fail\|mismatch' ci_log/freeze.txt 2>/dev/null) failing |"
          } | tee -a "$GITHUB_STEP_SUMMARY" ci_log/SUMMARY.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: CI_LOG
          path: ci_log
