# Study T phase 1 (study_t/PROTOCOL.md): census of Ruff autofix rules and the R2 families on the 60 most downloaded pure-Python
# PyPI packages.  No target code runs, no model calls.  Commits research_closure/results/study_t/.
name: Gatekeeper Study T census
on:
  workflow_dispatch:
    inputs:
      ruff: {description: "ruff version to pin (empty = latest, recorded in the census)", default: ""}
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install ruff
        env:
          RUFF: ${{ inputs.ruff }}
        run: |
          if [ -n "$RUFF" ]; then pip install -q "ruff==$RUFF"; else pip install -q ruff; fi
          ruff --version
      - run: python -m unittest tests.test_market_census -v
      - name: Census
        run: python tools/market_census.py /tmp/t_work out_t | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: STUDY_T_CENSUS
          path: out_t
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_closure/results/study_t
          cp out_t/* research_closure/results/study_t/
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_closure/results/study_t
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Study T census"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
