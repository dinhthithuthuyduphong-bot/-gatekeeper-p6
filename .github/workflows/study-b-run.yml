# Study B run. The pipeline refuses to start unless study_b/config_study_b.json has
# status FROZEN (set only after the protocol is frozen, committed and tagged).
name: Gatekeeper Study B run
on: workflow_dispatch
permissions:
  contents: read
jobs:
  study-b:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Show which commit and config this run uses
        run: |
          echo "ref: $GITHUB_REF  commit: $GITHUB_SHA"
          git log -1 --format='%H %s (%ci)'
          git tag --points-at HEAD || true
          ls -la study_b/ || echo "::error::study_b/ folder missing in this commit"
          python -c "import json;c=json.load(open('study_b/config_study_b.json'));print('status:',c.get('status'),'frozen_on:',c.get('frozen_on'),'experiment:',c.get('experiment_id'))"
          test -f study_b/FREEZE.json && echo "FREEZE.json present" || echo "::error::study_b/FREEZE.json missing: the frozen package was not pushed to this commit"
      - name: Check protocol freeze (fails closed while DRAFT)
        run: |
          python - <<'PY'
          import json, sys
          cfg = json.load(open("study_b/config_study_b.json"))
          if cfg.get("status") != "FROZEN":
              print(f"::error::Study B protocol status is {cfg.get('status')!r}; freeze it before running.")
              sys.exit(1)
          print("protocol frozen:", cfg.get("experiment_id"))
          PY
      - name: Verify freeze hashes
        run: python tools/freeze_study.py verify study_b
      - name: Install pytest and declared target requirements
        run: |
          python -m pip install --quiet "pytest==8.3.5"
          mkdir -p out_study_b
          python tools/install_requirements.py study_b/config_study_b.json out_study_b/PIP_FREEZE.txt
      - name: Fetch source files and frozen Study B targets
        run: |
          set -o pipefail
          mkdir -p out_study_b/logs
          python tools/fetch_real_targets.py real 2>&1 | tee out_study_b/logs/fetch_real.log
          python tools/fetch_real_targets.py study_b 2>&1 | tee out_study_b/logs/fetch_study_b.log
      - name: Run (refuses while DRAFT)
        run: |
          set -o pipefail
          python -m gatekeeper_lite run --config study_b/config_study_b.json --out out_study_b 2>&1 | tee out_study_b/logs/run.log
          cat out_study_b/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep receipts even when a step failed
        if: always()
        run: |
          cp study_b/FETCH_RECEIPT.json out_study_b/STUDY_B_FETCH_RECEIPT.json 2>/dev/null || true
          cp real/FETCH_RECEIPT.json out_study_b/REAL_SOURCES_FETCH_RECEIPT.json 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: STUDY_B_OUTPUT
          path: out_study_b
          if-no-files-found: warn
