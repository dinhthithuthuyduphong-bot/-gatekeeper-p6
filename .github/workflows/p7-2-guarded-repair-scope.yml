# Public development repair and negative applicability control; no model API, company data, paper or repository secrets.
# PASS means expected repair and abstention reproduced, not skill admission.
name: Gatekeeper P7.2 guarded repair and scope
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gatekeeper-p72-repair-scope
  cancel-in-progress: false
