      - name: Build isolated source packages and fixed dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          timeout 840 docker build --platform linux/amd64 --progress plain --build-arg PROFILE="$PROFILE" -t gk-p7-2:local p72_src 2>&1 | tee P7_2_REMOTE_OUTPUT/build.log
          docker image inspect gk-p7-2:local > P7_2_REMOTE_OUTPUT/built-image.json
      - name: Verify repair and abstention twice in fresh containers
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          timeout 660 python3 -B p72_src/run_containers.py
      - name: Final cleanup and absence check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p P7_2_REMOTE_OUTPUT
          docker ps -aq --filter label=gk-phase=p72 | xargs -r docker rm -f
          docker ps -aq --filter label=gk-phase=p72 > P7_2_REMOTE_OUTPUT/final-cleanup.txt
          test ! -s P7_2_REMOTE_OUTPUT/final-cleanup.txt
      - name: Preserve all receipts and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: P7_2_${{ matrix.profile }}_REMOTE_OUTPUT
          path: P7_2_REMOTE_OUTPUT/
          retention-days: 14
          if-no-files-found: error
