# Study E frame: read-only applicability scan of the frozen Study D skill (nothing executed).
name: Gatekeeper Study E applicability scan
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Scan
        run: |
          python tools/applicability_scan.py study_e/candidates.json out_e
          python tools/applicability_scan.py study_e/candidates_round2.json out_e/round2
          cat out_e/APPLICABILITY_SCAN.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: STUDY_E_APPLICABILITY_SCAN
          path: out_e
