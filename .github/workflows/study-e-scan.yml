# Study E frame: read-only applicability scan of the frozen Study D skill (nothing executed).
name: Gatekeeper Study E applicability scan
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Scan
        run: |
          python tools/applicability_scan.py study_e/candidates.json out_e
          python tools/applicability_scan.py study_e/candidates_round2.json out_e/round2
          cat out_e/APPLICABILITY_SCAN.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: STUDY_E_APPLICABILITY_SCAN
          path: out_e
