# Study P, DEVELOPMENT feasibility (0 cost): can the function edited by each Study N A* instance be called directly with
# generated inputs, and does the original differ from the upstream fix on some of them?  Not a registered study stage.
# The go / no-go threshold is fixed in research_closure/results/STUDY_P_PLAN.md BEFORE this runs.
name: Gatekeeper Study P feasibility (function-level oracle)
on:
  workflow_dispatch:
    inputs:
      shards: {description: "number of parallel shards", default: "27"}
      only_shards: {description: "optional comma-separated shard numbers (empty = all)", default: ""}
      timeout: {description: "seconds per instance", default: "2400"}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Required files and guards
        shell: bash
        run: |
          set -euo pipefail
          for f in tools/fn_probe.py tools/fn_probe_inner.py tools/fn_probe_shard.py tools/fn_probe_summary.py gatekeeper_ext/fn_inputs.py tools/n_s3_check.py tools/vet_target2.py tools/vet_dev.py gatekeeper_ext/testmut.py research_closure/results/study_n_s2/ELIGIBLE.json research_closure/results/STUDY_P_PLAN.md; do
            [ -f "$f" ] || { echo "::error::MISSING $f"; exit 1; }
          done
          python tools/repo_hygiene.py
          python tools/check_track.py research_closure/results/study_n_s2/ELIGIBLE.json ASTAR
      - id: m
        env:
          SHARDS: ${{ inputs.shards }}
          ONLY: ${{ inputs.only_shards }}
        run: |
          python - <<'PY'
          import json, os
          k = int(os.environ['SHARDS'])
          assert 1 <= k <= 100
          only = [int(x) for x in os.environ.get('ONLY', '').replace(' ', '').split(',') if x]
          assert all(0 <= x < k for x in only)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('matrix=' + json.dumps({'shard': only or list(range(k))}) + '\n')
          PY
  probe:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Probe shard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          mkdir -p out_p
          python tools/fn_probe_shard.py research_closure/results/study_n_s2/ELIGIBLE.json out_p "$SHARD" "$SHARDS" "$TIMEOUT" 2>&1 | tee out_p/log_shard.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: P_FEAS_${{ matrix.shard }}
          path: out_p
