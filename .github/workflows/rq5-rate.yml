# RQ5 step 3: the second, BLIND rater (strong model) codes the review items R / B / U.  Under 1 USD.
name: Gatekeeper RQ5 second rater
on: workflow_dispatch
permissions:
  contents: read
jobs:
  rate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Google Cloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        run: |
          t="$(gcloud auth print-access-token)"; echo "::add-mask::$t"; echo "GOOGLE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
          echo "GK_TOKEN_CMD=gcloud auth print-access-token" >> "$GITHUB_ENV"
      - run: |
          [ -f research_closure/results/rq5/RQ5_RATINGS_ASSISTANT.json ] || { echo "::error::the first rater's codes must be committed before the second rater runs"; exit 1; }
          mkdir -p out_rate
          python tools/rq5_rate_llm.py research_closure/results/rq5/RQ5_REVIEW_ITEMS.json out_rate/RQ5_RATINGS_SECOND.json research_closure/pilot/models.json vertex-gemini-argon 2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: RQ5_RATINGS_SECOND
          path: out_rate
