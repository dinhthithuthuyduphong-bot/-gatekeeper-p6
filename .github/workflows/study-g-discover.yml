# Study G candidate discovery via the GitHub search API (read-only, 0 cost).
name: Gatekeeper Study G discover
on: workflow_dispatch
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/discover_g_candidates.py out_g
          cat out_g/G_CANDIDATES.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: STUDY_G_CANDIDATES
          path: out_g
