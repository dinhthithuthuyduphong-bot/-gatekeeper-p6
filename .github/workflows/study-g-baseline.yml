# Study G runnability check: install + census baseline x3 + oracle on UNTREATED code (skill never applied).
name: Gatekeeper Study G baseline check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  baseline:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: G1_pydal
            python: "3.12"
          - target: K1_hera_pspec
            python: "3.12"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - shell: bash
        run: |
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_b
          python tools/baseline_check.py study_g/config_study_g.json ${{ matrix.target }} out_b 2>&1 | tail -20 | tee out_b/log.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: G_BASELINE_${{ matrix.target }}
          path: out_b
