# Study S (study_s/PROTOCOL.md): behaviour of real compositions on the functions Study R2 found touched by two families.
# G0 inputs only, no model calls.  Commits research_closure/results/study_s/.
name: Gatekeeper Study S compositions
on:
  workflow_dispatch:
    inputs:
      mode: {description: "registered, s-a1, s-a2, s-a3, s-a4 or s-a5 (amendments)", default: "s-a5"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: |
            3.8
            3.11
            3.12
      - name: Unit tests
        run: python -m unittest tests.test_composition_study tests.test_skill_library -v
      - name: Study S
        env:
          MODE: ${{ inputs.mode }}
        run: |
          flag=""; [ "$MODE" = "s-a1" ] && flag="--s-a1"; [ "$MODE" = "s-a2" ] && flag="--s-a2"; [ "$MODE" = "s-a3" ] && flag="--s-a3"; [ "$MODE" = "s-a4" ] && flag="--s-a4"; [ "$MODE" = "s-a5" ] && flag="--s-a5"
          python -W ignore tools/composition_study.py /tmp/s_work out_s $flag | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: STUDY_S
          path: out_s
      - name: Commit
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p research_closure/results/study_s
          cp out_s/* research_closure/results/study_s/
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_closure/results/study_s
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Study S compositions ($MODE)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
