# Study S (study_s/PROTOCOL.md): behaviour of real compositions on the functions Study R2 found touched by two families.
# G0 inputs only, no model calls.  Commits research_closure/results/study_s/.
name: Gatekeeper Study S compositions
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest tests.test_composition_study tests.test_skill_library -v
      - name: Study S
        run: python -W ignore tools/composition_study.py /tmp/s_work out_s | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: STUDY_S
          path: out_s
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_closure/results/study_s
          cp out_s/* research_closure/results/study_s/
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_closure/results/study_s
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Study S compositions"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
