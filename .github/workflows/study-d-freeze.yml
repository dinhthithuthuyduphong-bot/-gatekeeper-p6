# One-click freeze of Study D (+B9 config): sets FROZEN and the future seed time,
# recomputes FREEZE.json, commits and tags study-d-freeze.  Run once on the freeze date.
name: Gatekeeper Study D freeze
on: workflow_dispatch
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests must pass before freezing
        run: python -m unittest discover -s tests
      - name: Freeze
        run: |
          python tools/freeze_study_d.py --delay-minutes 60
          python tools/freeze_study.py verify study_d
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add study_d
          git commit -m "Freeze Study D (protocol, oracles, targets, B9 config)"
          git tag study-d-freeze
          git push origin HEAD --tags
          cat study_d/config_study_d.json >> "$GITHUB_STEP_SUMMARY"
