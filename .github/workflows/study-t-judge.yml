# Study T-A2: LLM-judge baseline (gemini-3.8-flash reads each cell's diff; no trial outcome).  4 shards, cap 0.75 USD each
# (3 USD in all).  Commits research_closure/results/study_t/JUDGE_*.json.
name: Gatekeeper Study T LLM judge
on:
  workflow_dispatch:
    inputs:
      results: {description: "results directory (study_t, or study_t2)", default: "study_t"}
      cap: {description: "USD cap per shard", default: "0.75"}
permissions:
  contents: write
jobs:
  judge:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -q "ruff==0.17.3" google-auth requests
      - name: Google Cloud auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        run: |
          t="$(gcloud auth print-access-token)"; echo "::add-mask::$t"; echo "GOOGLE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
          echo "GK_TOKEN_CMD=python $GITHUB_WORKSPACE/tools/fresh_gcp_token.py" >> "$GITHUB_ENV"
      - env:
          GK_T_RES: research_closure/results/${{ inputs.results }}
        run: python tools/market_judge.py /tmp/j_work out_judge research_closure/pilot/models.json --shard ${{ matrix.shard }} --shards 4 --cap ${{ inputs.cap }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: T_JUDGE_${{ matrix.shard }}
          path: out_judge
  commit:
    needs: judge
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}   # latest commit, not the run's start commit (T2 LJ incident)
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: T_JUDGE_*
          path: research_closure/results/${{ inputs.results }}
          merge-multiple: true
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "research_closure/results/${{ inputs.results }}"
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Study T LLM judge (${{ inputs.results }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
