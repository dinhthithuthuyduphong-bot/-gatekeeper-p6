          hashes = {'ocr': '095aaeb05ab02e3819f72c9144e42c73d3d510a29ddb5666a7c3743717ca55a5', 'pandas': '3ff0e9be91afad4b875332890a1d6fc851a166cd0c2ed95192b14ba7a159bf9f'}
          profile = os.environ['PROFILE']
          data = base64.b64decode(payloads[profile])
          assert hashlib.sha256(data).hexdigest() == hashes[profile]
          root = pathlib.Path('p66_src')
          root.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for name in z.namelist():
                  assert '/' not in name and name not in ['.', '..']
                  (root/name).write_bytes(z.read(name))
          receipt = {'schema':'gk_p66_host_v1', 'profile':profile, 'payload_sha256':hashes[profile],
                     'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir()},
                     'commit':os.environ['GITHUB_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'],
                     'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'], 'platform':platform.platform(),
                     'runner_image':os.environ.get('ImageVersion'), 'prospective_pairs':0}
          pathlib.Path('P6_6_REMOTE_OUTPUT/HOST.json').write_text(json.dumps(receipt,indent=2))
          pathlib.Path('P6_6_REMOTE_OUTPUT/ENVIRONMENT_CONTRACT.json').write_bytes((root/'ENVIRONMENT_CONTRACT.json').read_bytes())
          PY
          docker version > P6_6_REMOTE_OUTPUT/docker-version.txt
      - name: Build the same source environments with the lifecycle harness
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          case "$PROFILE" in
            ocr) image_tag=gk-p6-6:local ;;
            pandas) image_tag=gk-p6-6:local ;;
            *) exit 1 ;;
          esac
          timeout 1140 docker build --platform linux/amd64 --progress plain -t "$image_tag" p66_src 2>&1 | tee P6_6_REMOTE_OUTPUT/build.log
          docker image inspect "$image_tag" > P6_6_REMOTE_OUTPUT/built-image.json
      - name: Run seeded replay, deliberate faults, cleanup and clean retries
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          timeout 780 python3 -B p66_src/run_containers.py
      - name: Final cleanup and absence check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -aq --filter label=gk-phase=p66 | xargs -r docker rm -f
          docker ps -aq --filter label=gk-phase=p66 > P6_6_REMOTE_OUTPUT/final-cleanup.txt
          test ! -s P6_6_REMOTE_OUTPUT/final-cleanup.txt
      - name: Preserve contract receipts and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: P6_6_${{ matrix.profile }}_REMOTE_OUTPUT
          path: P6_6_REMOTE_OUTPUT/
          retention-days: 3
          if-no-files-found: warn
