# P6.6 closes the original GK-07 seed, fault, cleanup and retry criteria only.
name: Gatekeeper P6.6 runner closure
on:
  workflow_dispatch:
    inputs:
      permission_and_budget_confirmed:
        description: Authorized personal public research repo and standard runner use confirmed
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: gatekeeper-source-replay
  cancel-in-progress: false
jobs:
  runner-closure:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.permission_and_budget_confirmed && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
