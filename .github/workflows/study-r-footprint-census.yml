# Study R (study_r/PROTOCOL.md): footprint census of the two real skill families on every Study D, E, G target, cloned at the
# pinned revision.  AST analysis only: no target code runs, no model calls.  Commits research_closure/results/study_r/.
name: Gatekeeper Study R footprint census
on: workflow_dispatch
permissions:
  contents: write
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python tools/footprint_census.py /tmp/fp_work out_r | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: STUDY_R
          path: out_r
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_closure/results/study_r
          cp out_r/* research_closure/results/study_r/
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_closure/results/study_r
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Study R footprint census"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
