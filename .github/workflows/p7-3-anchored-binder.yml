# Public, already-exposed development binder evaluation; no model API, company data, paper or repository secrets.
# PASS means declared development outcomes reproduced; no independent transfer or admission claim.
name: Gatekeeper P7.3 anchored binder development
"on":
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: gatekeeper-p73-binder-development
  cancel-in-progress: false
