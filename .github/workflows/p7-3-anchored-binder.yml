                     'transport_sha256': '7bcc9b2f54171d46d1c65a9812834792983884b37e027bb392e4fc9093968b83', 'payload_encoding': 'base64+xz+zip-stored',
                     'run_id': os.environ['GITHUB_RUN_ID'], 'commit': os.environ['GITHUB_SHA'],
                     'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'platform': platform.platform(),
                     'runner_image': os.environ.get('ImageVersion'), 'prospective_pairs': 0}
          pathlib.Path('P7_3_REMOTE_OUTPUT/HOST.json').write_text(json.dumps(receipt, indent=2))
          PY
          docker version > P7_3_REMOTE_OUTPUT/docker-version.txt
      - name: Build isolated source packages and fixed dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          timeout 840 docker build --platform linux/amd64 --progress plain --build-arg PROFILE="$PROFILE" -t gk-p7-3:local p73_src 2>&1 | tee P7_3_REMOTE_OUTPUT/build.log
          docker image inspect gk-p7-3:local > P7_3_REMOTE_OUTPUT/built-image.json
      - name: Verify binder outcomes twice in fresh containers
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          timeout 660 python3 -B p73_src/run_containers.py
      - name: Final cleanup and absence check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p P7_3_REMOTE_OUTPUT
          docker ps -aq --filter label=gk-phase=p73 | xargs -r docker rm -f
          docker ps -aq --filter label=gk-phase=p73 > P7_3_REMOTE_OUTPUT/final-cleanup.txt
          test ! -s P7_3_REMOTE_OUTPUT/final-cleanup.txt
      - name: Preserve all receipts and failure logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: P7_3_${{ matrix.profile }}_REMOTE_OUTPUT
          path: P7_3_REMOTE_OUTPUT/
          retention-days: 14
          if-no-files-found: error
