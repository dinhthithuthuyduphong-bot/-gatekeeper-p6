          data = lzma.decompress(transport, format=lzma.FORMAT_XZ, memlimit=128 * 1024 * 1024)
          assert hashlib.sha256(data).hexdigest() == '3bb0ada9d2de0084519761e72fb0b6be5f8ec5bf96ca40a97881da1b998a0255'
          root = pathlib.Path('p73_src')
          root.mkdir()
          files = {}
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              assert sum(i.file_size for i in z.infolist()) < 10_000_000
              for info in z.infolist():
                  name = pathlib.PurePosixPath(info.filename)
                  assert not name.is_absolute() and '..' not in name.parts
                  assert not stat.S_ISLNK(info.external_attr >> 16)
                  target = root.joinpath(*name.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  content = z.read(info)
                  target.write_bytes(content)
                  files[str(name)] = hashlib.sha256(content).hexdigest()
