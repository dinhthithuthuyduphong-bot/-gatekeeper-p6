# One-click freeze of Study P.  Puts every study_p file, tool and document into extra_tracked, checks that the frames match
# the evidence and that the freeze preflight is clean, then freezes and tags study-p-freeze.
name: Gatekeeper Study P freeze
on: workflow_dispatch
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - name: Prepare, check the frames, preflight
        shell: bash
        run: |
          set -euo pipefail
          python tools/p_prepare_freeze.py
          python - <<'PY'
          import hashlib, json, sys
          sys.path.insert(0, 'tools')
          from run_study_d import drand_seed
          cfg = json.load(open('study_m/config_study_m.json'))
          h = hashlib.sha256(open('study_m/FREEZE.json', 'rb').read()).hexdigest()
          open('/tmp/seed.txt', 'w').write(str(drand_seed(cfg.get('seed_freeze_sha256') or h, cfg['seed_time_utc'])['seed']))
          PY
          python tools/p_frames.py "$(cat /tmp/seed.txt)" --check
          python tools/freeze_doctor.py study_p --out out_doctor
          grep -q "BLOCKERS: 0" out_doctor/FREEZE_DOCTOR.md || { cat out_doctor/FREEZE_DOCTOR.md; echo "::error::freeze preflight has blockers"; exit 1; }
      - run: |
          python tools/freeze_named_study.py study_p --delay-minutes 60
          python tools/freeze_study.py verify study_p
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add study_p
          git commit -m "Freeze Study P"
          git tag study-p-freeze
          git pull --rebase origin "${GITHUB_REF_NAME}"   # other pushes to main may have happened meanwhile
          git push origin HEAD --tags
