# Gatekeeper-Lite demo: unit tests + frozen demo run on a fresh GitHub-hosted runner.
# Works whether the project sits at the repository root or in a subfolder (e.g. gk_lite/).
# Pin action SHAs in actions.lock before using outputs as research evidence.
name: Gatekeeper-Lite demo
on: workflow_dispatch
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Locate project folder
        run: |
          main=$(find . -path ./.git -prune -o -path '*/gatekeeper_lite/__main__.py' -print | head -n 1)
          if [ -z "$main" ]; then
            echo "::error::gatekeeper_lite/__main__.py not found in the repository"
            find . -maxdepth 3 -not -path './.git*' | head -n 50
            exit 1
          fi
          dir=$(dirname "$(dirname "$main")")
          echo "GK_DIR=$dir" >> "$GITHUB_ENV"
          echo "project folder: $dir"; python --version; which python
      - name: Unit tests
        run: cd "$GK_DIR" && python -m unittest discover -s tests -v
      - name: Frozen demo run
        run: |
          cd "$GK_DIR"
          python -m gatekeeper_lite run --config demo/config.json --out out_demo
          sha256sum demo/config.json demo/skills/*.json > out_demo/INPUT_SHA256.txt
          cat out_demo/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: GK_LITE_DEMO_OUTPUT
          path: ${{ env.GK_DIR }}/out_demo
          if-no-files-found: error

  real-click:
    # Same pipeline on real Click code, scored by Click's own upstream tests.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Locate project folder
        run: |
          main=$(find . -path ./.git -prune -o -path '*/gatekeeper_lite/__main__.py' -print | head -n 1)
          echo "GK_DIR=$(dirname "$(dirname "$main")")" >> "$GITHUB_ENV"
      - name: Install pytest (oracle runner only)
        run: python -m pip install --quiet "pytest==8.3.5"
      - name: Fetch frozen real targets
        run: cd "$GK_DIR" && python tools/fetch_real_targets.py real
      - name: Real-target run
        run: |
          cd "$GK_DIR"
          python -m gatekeeper_lite run --config real/config_real.json --out out_real
          cp real/FETCH_RECEIPT.json out_real/
          cat out_real/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: GK_LITE_REAL_CLICK_OUTPUT
          path: |
            ${{ env.GK_DIR }}/out_real
            ${{ env.GK_DIR }}/real/FETCH_RECEIPT.json
          if-no-files-found: warn
