# One-click freeze of Study M (FROZEN, seed time = now + 60 min, hashes, tag study-m-freeze).
name: Gatekeeper Study M freeze
on: workflow_dispatch
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: |
          python tools/freeze_named_study.py study_m --delay-minutes 60
          python tools/freeze_study.py verify study_m
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add study_m
          git commit -m "Freeze Study M"
          git tag study-m-freeze
          git push origin HEAD --tags
