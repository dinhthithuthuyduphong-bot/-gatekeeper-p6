# Read-only check before freezing a study: every file of the study directory must be hash-bound.
name: Gatekeeper freeze preflight
on:
  workflow_dispatch:
    inputs:
      study: {description: "study directory, e.g. study_n", required: true}
permissions:
  contents: read
jobs:
  doctor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: |
          python tools/freeze_doctor.py "${{ inputs.study }}" --out out_doctor | tee out_doctor_log.txt
          cat out_doctor/FREEZE_DOCTOR.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: FREEZE_DOCTOR
          path: out_doctor
