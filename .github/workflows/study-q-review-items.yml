# Study Q amendment Q-A1, steps 1-2: collect the review-capture records, check reproduction against the cohort record,
# build the blind review items, and commit everything to research_closure/results/study_q/qa1/.  No model calls.
name: Gatekeeper Study Q review items (amendment Q-A1)
on:
  workflow_dispatch:
    inputs:
      runs: {description: "comma-separated review-capture run ids (later runs win on duplicates)", required: true}
permissions:
  contents: write
  actions: read
jobs:
  items:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/freeze_study.py verify study_q
      - name: Download
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.runs }}
        shell: bash
        run: |
          set -euo pipefail
          i=0
          for id in $(echo "$RUNS" | tr ',;' '  '); do
            i=$((i+1))
            gh run download "$id" -R "$GITHUB_REPOSITORY" -p 'R_*' -D "cap/$(printf '%02d' $i)_$id"
          done
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          SEED=$(python -c "import json,sys;sys.path.insert(0,'tools');from run_study_d import drand_seed;c=json.load(open('study_q/config_study_q.json'));print(drand_seed(c['seed_freeze_sha256'],c['seed_time_utc'])['seed'])")
          python tools/q_review_items.py cap research_closure/results/study_q/Q_RECORDS.jsonl.gz study_q/evidence/VERIFIED.json "$SEED" out_items
          tar -czf out_items/CAPTURE.tar.gz cap
          { echo '```json'; python -c "import json;print(json.dumps(json.load(open('out_items/REPRO.json'))['stats'],indent=1))"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: QA1_ITEMS
          path: out_items
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research_closure/results/study_q/qa1
          cp out_items/REPRO.json out_items/ITEMS.json out_items/KEY.json out_items/CAPTURE.tar.gz research_closure/results/study_q/qa1/
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_closure/results/study_q/qa1
          git commit -m "Study Q Q-A1 review items (runs ${{ inputs.runs }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
