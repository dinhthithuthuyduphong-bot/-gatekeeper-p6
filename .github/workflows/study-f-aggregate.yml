# Study F final aggregation (e-Holm over K = 144, within-model effects).  Needs the held-out
# outputs (HELDOUT_*.json) committed under study_f/heldout/.
name: Gatekeeper Study F aggregate
on: workflow_dispatch
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          set -euo pipefail
          python tools/freeze_study.py verify study_f
          python tools/aggregate_study_f.py study_f/config_study_f.json study_f/heldout STUDY_F_RESULTS.md
          cat STUDY_F_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: STUDY_F_RESULTS
          path: STUDY_F_RESULTS.md
