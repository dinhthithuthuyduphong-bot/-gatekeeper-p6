      - name: Build legacy runtime and all three complete source arms
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          timeout 1140 docker build --platform linux/amd64 --progress plain -t gk-p6-4:local p64_src 2>&1 | tee P6_4_REMOTE_OUTPUT/build.log
          docker image inspect gk-p6-4:local > P6_4_REMOTE_OUTPUT/built-image.json
      - name: Run six isolated containers and compare exact P5 test outcomes
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          timeout 660 python3 -B p64_src/run_containers.py
      - name: Clean up stopped or interrupted research containers
        if: always()
        shell: bash
        run: |
          docker ps -aq --filter label=gk-phase=p64 | xargs -r docker rm -f
      - name: Preserve reports and setup failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: P6_4_REMOTE_OUTPUT
          path: P6_4_REMOTE_OUTPUT/
          retention-days: 3
          if-no-files-found: warn
