# Read-only scan of Study B candidate repositories (no candidate code is executed).
name: Gatekeeper Study B candidate scan
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Scan candidates
        run: |
          python tools/scan_candidates.py study_b/candidates.json out_scan
          python tools/scan_candidates.py study_b/candidates_round2.json out_scan/round2
          python tools/scan_candidates.py study_b/candidates_round3.json out_scan/round3
          cat out_scan/round3/CANDIDATE_SCAN.md >> "$GITHUB_STEP_SUMMARY"
          cat out_scan/round2/CANDIDATE_SCAN.md >> "$GITHUB_STEP_SUMMARY"
          cat out_scan/CANDIDATE_SCAN.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: STUDY_B_CANDIDATE_SCAN
          path: out_scan
          if-no-files-found: error
