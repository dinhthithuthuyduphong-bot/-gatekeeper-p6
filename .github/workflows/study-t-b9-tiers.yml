# Study T-A7: B9 with the medium (flash, high reasoning) and strong (argon) models on the same 150 cells as T-A6.
# Paid, capped (medium 4 USD, strong 10 USD).  Commits research_closure/results/study_t/B9_{medium,strong}_*.json and B9_RESULT_*.json.
name: Gatekeeper Study T B9 tiers
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "JSON list of {shard, tag, model, effort, cap}; default all eight"
        default: >-
          [{"shard":0,"tag":"medium","model":"vertex-gemini-flash","effort":"high","cap":"1.0"},{"shard":1,"tag":"medium","model":"vertex-gemini-flash","effort":"high","cap":"1.0"},{"shard":2,"tag":"medium","model":"vertex-gemini-flash","effort":"high","cap":"1.0"},{"shard":3,"tag":"medium","model":"vertex-gemini-flash","effort":"high","cap":"1.0"},{"shard":0,"tag":"strong","model":"vertex-gemini-argon","effort":"low","cap":"2.5"},{"shard":1,"tag":"strong","model":"vertex-gemini-argon","effort":"low","cap":"2.5"},{"shard":2,"tag":"strong","model":"vertex-gemini-argon","effort":"low","cap":"2.5"},{"shard":3,"tag":"strong","model":"vertex-gemini-argon","effort":"low","cap":"2.5"}]
permissions:
  contents: write
jobs:
  b9:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.jobs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -q "ruff==0.17.3" google-auth requests
      - run: python -m unittest tests.test_market_b9 -v
      - name: Google Cloud auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        run: |
          t="$(gcloud auth print-access-token)"; echo "::add-mask::$t"; echo "GOOGLE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
          echo "GK_TOKEN_CMD=python $GITHUB_WORKSPACE/tools/fresh_gcp_token.py" >> "$GITHUB_ENV"
      - env:
          GK_MEMCAP_GB: "2"
        run: >-
          python -W ignore tools/market_b9.py /tmp/b9_work out_b9 research_closure/pilot/models.json --shard ${{ matrix.shard }} --shards 4
          --cap ${{ matrix.cap }} --model ${{ matrix.model }} --effort ${{ matrix.effort }} --tag ${{ matrix.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: T_B9_${{ matrix.tag }}_${{ matrix.shard }}
          path: out_b9
  analyse:
    needs: b9
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}   # latest commit, not the run's start commit (T2 LJ incident)
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: T_B9_*
          path: research_closure/results/study_t
          merge-multiple: true
      - run: |
          python tools/b9_analyze.py research_closure/results/study_t medium | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/b9_analyze.py research_closure/results/study_t strong | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_closure/results/study_t
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Study T B9 tiers"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
