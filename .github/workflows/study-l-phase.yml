# Gate phase diagram (0 cost): recompute study_l/PHASE_DIAGRAM.md and compare with the committed file.
name: Gatekeeper gate phase diagram
on: workflow_dispatch
permissions:
  contents: read
jobs:
  phase:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q numpy
          python tools/gate_phase_diagram.py --out PHASE_DIAGRAM_CI.md
          cat PHASE_DIAGRAM_CI.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: PHASE_DIAGRAM
          path: PHASE_DIAGRAM_CI.md
