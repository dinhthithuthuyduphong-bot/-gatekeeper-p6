# Study P, DEVELOPMENT feasibility step 2: the light model writes the input generator of each edited function (at most two
# calls per function, Free Trial credit, hard cap 0.15 USD per instance).  Design and threshold (>= 27 of 107 usable) are
# fixed in research_closure/results/STUDY_P_PLAN.md BEFORE this runs.  Not a registered study stage.
name: Gatekeeper Study P feasibility step 2 (model-written generators)
on:
  workflow_dispatch:
    inputs:
      shards: {description: "number of parallel shards", default: "27"}
      only_shards: {description: "optional comma-separated shard numbers (empty = all)", default: ""}
      timeout: {description: "seconds per instance", default: "2400"}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Required files and guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Bước 2: bộ sinh do model nhẹ viết" research_closure/results/STUDY_P_PLAN.md || { echo "::error::the step-2 design is not committed in STUDY_P_PLAN.md"; exit 1; }
          for f in tools/fn_probe_llm.py gatekeeper_ext/fn_llm_gen.py tools/cohort_inner.py gatekeeper_ext/issue_fetch.py research_closure/pilot/models.json tools/fn_probe.py tools/fn_probe_inner.py tools/fn_probe_shard.py tools/fn_probe_summary.py gatekeeper_ext/fn_inputs.py tools/n_s3_check.py tools/vet_target2.py tools/vet_dev.py gatekeeper_ext/testmut.py research_closure/results/study_n_s2/ELIGIBLE.json research_closure/results/STUDY_P_PLAN.md; do
            [ -f "$f" ] || { echo "::error::MISSING $f"; exit 1; }
          done
          python tools/repo_hygiene.py
          python tools/check_track.py research_closure/results/study_n_s2/ELIGIBLE.json ASTAR
      - id: m
        env:
          SHARDS: ${{ inputs.shards }}
          ONLY: ${{ inputs.only_shards }}
        run: |
          python - <<'PY'
          import json, os
          k = int(os.environ['SHARDS'])
          assert 1 <= k <= 100
          only = [int(x) for x in os.environ.get('ONLY', '').replace(' ', '').split(',') if x]
          assert all(0 <= x < k for x in only)
          open(os.environ['GITHUB_OUTPUT'], 'a').write('matrix=' + json.dumps({'shard': only or list(range(k))}) + '\n')
          PY
  probe:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Google Cloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        run: |
          t="$(gcloud auth print-access-token)"; echo "::add-mask::$t"; echo "GOOGLE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
          echo "GK_TOKEN_CMD=gcloud auth print-access-token" >> "$GITHUB_ENV"
      - name: Probe shard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ inputs.shards }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          set -euo pipefail
          mkdir -p out_p
          python tools/fn_probe_shard.py research_closure/results/study_n_s2/ELIGIBLE.json out_p "$SHARD" "$SHARDS" "$TIMEOUT" --llm research_closure/pilot/models.json 0.15 2>&1 | tee out_p/log_shard.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: P_FEAS2_${{ matrix.shard }}
          path: out_p
