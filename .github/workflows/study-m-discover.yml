# Study M stage S1: outcome-blind discovery of bug-fix pull requests (read-only, 0 cost).
# Refuses to run unless study_m is FROZEN and its hashes verify.  Run at least 60 minutes after the freeze (drand seed).
# Version 2 (amendment M-A2): lazy, seed-ordered, rate-limit aware, with checkpoints.  If it stops early, run again
# with `start` set to `next_position` from M_DISCOVERY_LOG.json.
name: Gatekeeper Study M discover
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'stop after this many candidates pass all filters'
        default: '500'
      max_examined:
        description: 'maximum number of pull requests whose files are fetched'
        default: '3500'
      start:
        description: 'position in the seed order to start from (0 for a fresh run)'
        default: '0'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Freeze check
        run: |
          python -c "import json,sys;c=json.load(open('study_m/config_study_m.json'));sys.exit(0 if c.get('status')=='FROZEN' else 'not FROZEN')"
          python tools/freeze_study.py verify study_m
      - name: Seed (drand round after the freeze)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out_m
          python - <<'PY'
          import hashlib, json, sys
          sys.path.insert(0, 'tools')
          from run_study_d import drand_seed
          cfg = json.load(open('study_m/config_study_m.json'))
          h = hashlib.sha256(open('study_m/FREEZE.json', 'rb').read()).hexdigest()
          s = drand_seed(cfg.get('seed_freeze_sha256') or h, cfg['seed_time_utc'])
          json.dump(s, open('out_m/SEED.json', 'w'), indent=1)
          open('out_m/seed.txt', 'w').write(str(s['seed']))
          PY
      - name: Discover
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SEARCH_TOKEN || github.token }}
          TARGET: ${{ inputs.target }}
          MAX_EXAMINED: ${{ inputs.max_examined }}
          START: ${{ inputs.start }}
        run: |
          set -euo pipefail
          python -u tools/discover_m_candidates.py out_m --seed "$(cat out_m/seed.txt)" --target "$TARGET" --max-examined "$MAX_EXAMINED" --start "$START" --time-budget-min 330 2>&1 | tee out_m/log.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: STUDY_M_DISCOVERY
          path: out_m
