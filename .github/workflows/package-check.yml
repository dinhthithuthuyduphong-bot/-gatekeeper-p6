# Read-only: is a delivered package complete and unchanged in the repository?  (partial uploads, wrong folders)
name: Gatekeeper package check
on:
  workflow_dispatch:
    inputs:
      manifest: {description: "manifest file", required: true, default: "research_closure/manifests/study_n_s3_package.json"}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: |
          python tools/package_check.py "${{ inputs.manifest }}" --out out_pkg
          cat out_pkg/PACKAGE_CHECK.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: PACKAGE_CHECK
          path: out_pkg
