# Model stand-ins for human review steps (docs/PAPER_TODO.md S8, S11): a third, blind rater for Q-A1 (gemini-3.8-flash),
# a model check of every proof, and three ISSTA-style model reviews.  Paid (capped); results are labelled as model reviews.
# Commits research_closure/results/study_q/qa1/{RATINGS_THIRD,QA1_THREE_RATERS}.json and research_closure/results/model_reviews/.
name: Gatekeeper model stand-ins
on:
  workflow_dispatch:
    inputs:
      which: {description: "all | third | proofs | mock | calibration", default: "all"}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m unittest tests.test_llm_stand_ins -v
      - name: Google Cloud auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        run: |
          t="$(gcloud auth print-access-token)"; echo "::add-mask::$t"; echo "GOOGLE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
          pip install -q google-auth requests
          echo "GK_TOKEN_CMD=python $GITHUB_WORKSPACE/tools/fresh_gcp_token.py" >> "$GITHUB_ENV"
      - name: Third rater (Q-A1)
        if: inputs.which == 'all' || inputs.which == 'third'
        run: |
          D=research_closure/results/study_q/qa1
          python tools/rq5_rate_llm.py $D/ITEMS.json $D/RATINGS_THIRD.json research_closure/pilot/models.json vertex-gemini-flash 2
          python tools/qa1_three_raters.py $D | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Rater calibration (known B and R items)
        if: inputs.which == 'all' || inputs.which == 'calibration'
        run: |
          for m in vertex-gemini-argon vertex-gemini-flash; do
            python tools/rater_calibration.py research_closure/results/model_reviews research_closure/pilot/models.json $m 0.5 | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Proof check
        if: inputs.which == 'all' || inputs.which == 'proofs'
        run: |
          python tools/llm_review.py proofs research_closure/results/model_reviews research_closure/pilot/models.json vertex-gemini-argon 2
          cat research_closure/results/model_reviews/PROOF_REVIEW.md >> "$GITHUB_STEP_SUMMARY"
      - name: Mock reviews
        if: inputs.which == 'all' || inputs.which == 'mock'
        run: |
          python tools/llm_review.py mock research_closure/results/model_reviews research_closure/pilot/models.json vertex-gemini-argon 3
          cat research_closure/results/model_reviews/MOCK_REVIEWS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: MODEL_STAND_INS
          path: |
            research_closure/results/model_reviews
            research_closure/results/study_q/qa1
      - name: Commit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_closure/results/model_reviews research_closure/results/study_q/qa1 2>/dev/null || true
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "Model stand-ins (${{ inputs.which }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
