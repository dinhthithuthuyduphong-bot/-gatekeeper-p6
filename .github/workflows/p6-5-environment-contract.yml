# Two development profiles, frozen from verified P6.3 / P6.4 receipts.
name: Gatekeeper P6.5 environment contract
on:
  workflow_dispatch:
    inputs:
      permission_and_budget_confirmed:
        description: Authorized personal public research repo and standard runner use confirmed
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: gatekeeper-source-replay
  cancel-in-progress: false
jobs:
  environment-contract:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.permission_and_budget_confirmed && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [ocr, pandas]
