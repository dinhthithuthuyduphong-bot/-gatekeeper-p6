          hashes = {'ocr': '4aa6723f944368ed5968b9e2aa14ad8496cf3ed7249fd9e75d2fea66fbfa3611', 'pandas': '46dcb237dcb21606a54f9a75127aca9fd1d4475bfbd6e09f39416a8bd6ae39b6'}
          profile = os.environ['PROFILE']
          data = base64.b64decode(payloads[profile])
          assert hashlib.sha256(data).hexdigest() == hashes[profile]
          root = pathlib.Path('p65_src')
          root.mkdir()
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for name in z.namelist():
                  assert '/' not in name and name not in ['.', '..']
                  (root/name).write_bytes(z.read(name))
          receipt = {'schema':'gk_p65_host_v1', 'profile':profile, 'payload_sha256':hashes[profile],
                     'files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir()},
                     'commit':os.environ['GITHUB_SHA'], 'run_id':os.environ['GITHUB_RUN_ID'],
                     'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'], 'platform':platform.platform(),
                     'runner_image':os.environ.get('ImageVersion'), 'prospective_pairs':0}
          pathlib.Path('P6_5_REMOTE_OUTPUT/HOST.json').write_text(json.dumps(receipt,indent=2))
          pathlib.Path('P6_5_REMOTE_OUTPUT/ENVIRONMENT_CONTRACT.json').write_bytes((root/'ENVIRONMENT_CONTRACT.json').read_bytes())
          PY
          docker version > P6_5_REMOTE_OUTPUT/docker-version.txt
      - name: Build with pinned OS versions and enforce prior environment identity
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          case "$PROFILE" in
            ocr) image_tag=gk-p6-3:local ;;
            pandas) image_tag=gk-p6-4:local ;;
            *) exit 1 ;;
          esac
          timeout 1140 docker build --platform linux/amd64 --progress plain -t "$image_tag" p65_src 2>&1 | tee P6_5_REMOTE_OUTPUT/build.log
          docker image inspect "$image_tag" > P6_5_REMOTE_OUTPUT/built-image.json
      - name: Run six isolated containers under the frozen contract
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          timeout 660 python3 -B p65_src/run_containers.py
      - name: Clean up research containers
        if: always()
        shell: bash
        run: |
          docker ps -aq --filter label=gk-phase=p65 | xargs -r docker rm -f
      - name: Preserve contract receipts and failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P6_5_${{ matrix.profile }}_REMOTE_OUTPUT
          path: P6_5_REMOTE_OUTPUT/
          retention-days: 3
          if-no-files-found: warn
