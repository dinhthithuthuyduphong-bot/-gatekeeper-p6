# One-click freeze of Study M (RR) (FROZEN, seed time = now + 60 min, hashes, tag study-m-rr-freeze).
name: Gatekeeper Study M (RR) freeze
on: workflow_dispatch
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: |
          python tools/freeze_named_study.py study_m_rr --delay-minutes 60
          python tools/freeze_study.py verify study_m_rr
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add study_m_rr
          git commit -m "Freeze Study M (RR)"
          git tag study-m-rr-freeze
          git push origin HEAD --tags
