# B9 pipeline acceptance at 0 cost: the frozen run_b9.py replays a cassette whose "model"
# answer is the upstream gold fix.  Not B9 evidence; no API key used.
name: Gatekeeper B9 dry run (gold patches)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  dryrun:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: D1_py_ecc
            python: "3.12"
            os: ubuntu-24.04
          - target: D2_cerberus
            python: "3.8"
            os: ubuntu-22.04
          - target: D3_speckit
            python: "3.12"
            os: ubuntu-24.04
          - target: D4_openfeature
            python: "3.12"
            os: ubuntu-24.04
          - target: D5_pycubrid
            python: "3.12"
            os: ubuntu-24.04
          - target: A1_speckit_catalog
            python: "3.12"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Study D freeze (shared runner unchanged)
        run: python tools/freeze_study.py verify study_d
      - name: Dry run
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_dry
          python tools/b9_dryrun.py ${{ matrix.target }} out_dry 2>&1 | tee out_dry/log_${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: B9_DRYRUN_${{ matrix.target }}
          path: out_dry
