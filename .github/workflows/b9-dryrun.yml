# B9 pipeline acceptance at 0 cost: the frozen run_b9.py replays a cassette whose "model"
# answer is the upstream gold fix.  Not B9 evidence; no API key used.
name: Gatekeeper B9 dry run (gold patches)
on:
  workflow_dispatch:
    inputs:
      source:
        description: "gold (upstream fix) or skill (frozen skill's own diff)"
        required: true
        default: gold
      only:
        description: "comma-separated targets (empty = all)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  dryrun:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: D1_py_ecc
            python: "3.12"
            os: ubuntu-24.04
          - target: D2_cerberus
            python: "3.8"
            os: ubuntu-22.04
          - target: D3_speckit
            python: "3.12"
            os: ubuntu-24.04
          - target: D4_openfeature
            python: "3.12"
            os: ubuntu-24.04
          - target: D5_pycubrid
            python: "3.12"
            os: ubuntu-24.04
          - target: A1_speckit_catalog
            python: "3.12"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SELECTED: ${{ inputs.only == '' || contains(inputs.only, matrix.target) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ env.SELECTED == 'true' }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: ${{ env.SELECTED == 'true' }}
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Study D freeze (shared runner unchanged)
        if: ${{ env.SELECTED == 'true' }}
        run: python tools/freeze_study.py verify study_d
      - name: Dry run
        if: ${{ env.SELECTED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_dry
          python tools/b9_dryrun.py ${{ matrix.target }} out_dry ${{ inputs.source }} 2>&1 | tee out_dry/log_${{ matrix.target }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && env.SELECTED == 'true' }}
        with:
          name: B9_DRYRUN_${{ inputs.source }}_${{ matrix.target }}
          path: out_dry
