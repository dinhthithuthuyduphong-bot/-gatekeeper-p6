# Verify the frozen hash sets of every study (D, E, F); clean-room covers only Study D.
name: Gatekeeper freeze verify (all studies)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          set -euo pipefail
          for s in study_d study_e study_f; do
            echo "== $s"; python tools/freeze_study.py verify $s | tee -a "$GITHUB_STEP_SUMMARY"
          done
