# Clean-room reproduction: fresh runner, fresh checkout, documented commands only.
name: Gatekeeper clean-room check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Clean-room checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/clean_room_check.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify Study F freeze
        run: python tools/freeze_study.py verify study_f
