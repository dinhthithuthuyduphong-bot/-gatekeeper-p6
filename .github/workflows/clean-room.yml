# Clean-room reproduction: fresh runner, fresh checkout, documented commands only.
name: Gatekeeper clean-room check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python tools/clean_room_check.py | tee -a "$GITHUB_STEP_SUMMARY"
