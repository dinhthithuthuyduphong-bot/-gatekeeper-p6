# Clean-room reproduction: fresh runner, fresh checkout, documented commands only.
name: Gatekeeper clean-room check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Clean-room checks
        shell: bash
        run: |
          set -euo pipefail
          python tools/clean_room_check.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify Study F freeze
        run: python tools/freeze_study.py verify study_f
