# RQ3 (plan: research_closure/results/RQ3_PLAN.md): hand-written vs automatic generators on the evaluation targets of
# Studies D, E, G.  One job per target, with the target's own Python.  Independent of study_p: runs in parallel with it.
name: Gatekeeper RQ3 (generator agreement)
on:
  workflow_dispatch:
    inputs:
      n: {description: "inputs per scope or function", default: "200"}
      only: {description: "optional comma-separated target ids to (re)run, e.g. G1_pydal (empty = all)", default: ""}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - id: m
        env:
          ONLY: ${{ inputs.only }}
        run: |
          [ -f research_closure/results/RQ3_PLAN.md ] || { echo "::error::the RQ3 plan is not committed"; exit 1; }
          python - <<'PY'
          import glob, json, os
          inc, skipped = [], []
          for f in sorted(glob.glob('study_[deg]/eval_targets/*/gk_target.json')):
              m = json.load(open(f))
              tid = f.split('/')[2]
              # rule of research_closure/results/RQ3_PLAN.md: every evaluation target except smoke ones
              if 'SMOKE' in str(m.get('role', '')).upper() or 'local' in m.get('checkout', {}):
                  skipped.append(tid)
                  continue
              inc.append({'study': f.split('/')[0], 'id': tid, 'py': m.get('python', '3.12')})
          only = [x for x in os.environ.get('ONLY', '').replace(' ', '').split(',') if x]
          if only:
              unknown = sorted(set(only) - {x['id'] for x in inc})
              assert not unknown, 'unknown target ids: %s' % unknown
              inc = [x for x in inc if x['id'] in only]
          print('RQ3 targets (%d):' % len(inc), [x['id'] for x in inc])
          print('skipped as smoke (%d):' % len(skipped), skipped)
          assert inc, 'no evaluation target found'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as s:
              s.write('RQ3 targets (%d): %s\n\nskipped as smoke: %s\n' % (len(inc), ', '.join(x['id'] for x in inc), ', '.join(skipped) or 'none'))
          open(os.environ['GITHUB_OUTPUT'], 'a').write('matrix=' + json.dumps({'include': inc}) + '\n')
          PY
  target:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: |
            ${{ matrix.py }}
            3.12
      - name: Google Cloud auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        run: |
          t="$(gcloud auth print-access-token)"; echo "::add-mask::$t"; echo "GOOGLE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
          pip install -q google-auth requests
          echo "GK_TOKEN_CMD=python $GITHUB_WORKSPACE/tools/fresh_gcp_token.py" >> "$GITHUB_ENV"
      - name: RQ3 on one target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out_rq3
          PYT="$(command -v python${{ matrix.py }})"
          "$PYT" -m pip install -q pytest
          python -u tools/rq3_target.py "${{ matrix.study }}" "${{ matrix.id }}" out_rq3 --target-python "$PYT" --models research_closure/pilot/models.json --cap 0.5 --n "${{ inputs.n }}" 2>&1 | tee out_rq3/log.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: RQ3_${{ matrix.id }}
          path: out_rq3
