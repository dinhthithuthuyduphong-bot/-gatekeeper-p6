# Study P frame, part B (0 cost, read-only GitHub search): the extended search space (pages 3-5 of the original windows,
# pages 1-5 of 2021-01..2022-12), same queries, filters and seed order.  Appends part B to study_p while it is DRAFT.
# Run again to continue: it picks up after the part B already committed (study_p/evidence/P_EXT_CANDIDATES.json).
name: Gatekeeper Study P extend frame (part B)
on:
  workflow_dispatch:
    inputs:
      target: {description: "part-B candidates to keep in this run", default: "3000"}
      max_examined: {description: "maximum pull requests whose files are fetched", default: "25000"}
permissions:
  contents: write
jobs:
  extend:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Guards
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json,sys;c=json.load(open('study_p/config_study_p.json'));sys.exit(0 if c.get('status')=='DRAFT' else 'study_p is not DRAFT')"
          python tools/freeze_study.py verify study_m
          for f in tools/discover_p_extend.py tools/p_assemble_ext.py tools/p_frames.py study_p/candidates_astar.json study_p/frame_rr.json study_p/evidence/N_CANDIDATES.json study_m_astar/evidence/s1/M_ORDERED.json study_n/evidence/N_CANDIDATES.json; do
            [ -f "$f" ] || { echo "::error::MISSING $f"; exit 1; }
          done
      - name: Seed of Study M stage S1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out_x
          python - <<'PY'
          import hashlib, json, sys
          sys.path.insert(0, 'tools')
          from run_study_d import drand_seed
          cfg = json.load(open('study_m/config_study_m.json'))
          h = hashlib.sha256(open('study_m/FREEZE.json', 'rb').read()).hexdigest()
          s = drand_seed(cfg.get('seed_freeze_sha256') or h, cfg['seed_time_utc'])
          open('out_x/seed.txt', 'w').write(str(s['seed']))
          PY
      - name: Discover part B
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SEARCH_TOKEN || github.token }}
          TARGET: ${{ inputs.target }}
          MAX_EXAMINED: ${{ inputs.max_examined }}
        run: |
          set -euo pipefail
          AFTER=""
          if [ -f study_p/evidence/P_EXT_CANDIDATES.json ]; then AFTER="--after study_p/evidence/P_EXT_CANDIDATES.json"; fi
          python -u tools/discover_p_extend.py out_x --seed "$(cat out_x/seed.txt)" \
            --exclude study_m_astar/evidence/s1/M_ORDERED.json --exclude study_n/evidence/N_CANDIDATES.json --exclude study_p/evidence/N_CANDIDATES.json \
            $AFTER --target "$TARGET" --max-examined "$MAX_EXAMINED" 2>&1 | tee out_x/log.txt
      - name: Append the batch to the evidence, rebuild the frames from the evidence, commit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f out_x/P_EXT_CANDIDATES.json ] || { echo "no checkpoint written; nothing to commit"; exit 0; }
          python - <<'PY'
          import json, os
          prev = json.load(open('study_p/evidence/P_EXT_CANDIDATES.json')) if os.path.exists('study_p/evidence/P_EXT_CANDIDATES.json') else []
          new = json.load(open('out_x/P_EXT_CANDIDATES.json'))
          json.dump(prev + new, open('study_p/evidence/P_EXT_CANDIDATES.json', 'w'), indent=1)
          logs = json.load(open('study_p/evidence/P_EXT_LOGS.json')) if os.path.exists('study_p/evidence/P_EXT_LOGS.json') else []
          json.dump(logs + [json.load(open('out_x/P_EXT_LOG.json'))], open('study_p/evidence/P_EXT_LOGS.json', 'w'), indent=1)
          PY
          python tools/p_frames.py "$(cat out_x/seed.txt)"
          python tools/p_frames.py "$(cat out_x/seed.txt)" --check
          if ! git diff --quiet -- study_m study_m_astar study_m_rr study_n; then
            echo "::error::a frozen study directory changed; nothing is committed"; exit 1
          fi
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add study_p
          git commit -m "Study P frame: part B batch (checkpointed), frames rebuilt from the evidence"
          git pull --rebase origin "${GITHUB_REF_NAME}"   # other pushes to main may have happened meanwhile
          git push origin HEAD
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: STUDY_P_PART_B
          path: out_x
