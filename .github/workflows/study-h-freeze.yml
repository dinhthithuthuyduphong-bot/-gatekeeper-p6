# One-click freeze of Study H (FROZEN, seed time = now + 60 min, hashes, tag study-h-freeze).
name: Gatekeeper Study H freeze
on: workflow_dispatch
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: |
          python tools/freeze_named_study.py study_h --delay-minutes 60
          python tools/freeze_study.py verify study_h
          git config user.name "gatekeeper-freeze-bot"
          git config user.email "actions@users.noreply.github.com"
          git add study_h
          git commit -m "Freeze Study H"
          git tag study-h-freeze
          git push origin HEAD --tags
