# Smoke test of the full Study D runner on a DEVELOPMENT fixture (no evaluation data):
# drand seed, freeze hashing, multi-module bind, census path, draw harness, aggregation,
# ablation replay and the final report.
name: Gatekeeper Study D smoke
on: workflow_dispatch
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Smoke run
        run: |
          set -o pipefail
          mkdir -p out_smoke
          python tools/freeze_study.py freeze study_d_smoke
          python -m pip install -q "pytest==8.3.5"
          python tools/run_study_d.py study_d_smoke/config_study_d.json S1_demo_port out_smoke 2>&1 | tee out_smoke/log_S1.txt
          python tools/run_study_d.py study_d_smoke/config_study_d.json S2_click_821 out_smoke 2>&1 | tee out_smoke/log_S2.txt
          python tools/aggregate_study_d.py study_d_smoke/config_study_d.json out_smoke out_smoke/AGGREGATE.json
          python tools/report_study_d.py study_d_smoke/config_study_d.json out_smoke out_smoke/REPORT.md
          cat out_smoke/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: STUDY_D_SMOKE
          path: out_smoke
