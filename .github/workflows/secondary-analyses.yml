# Post-hoc secondary analyses on the frozen traces of Studies D/E (0 cost, no target execution).
name: Gatekeeper secondary analyses
on: workflow_dispatch
permissions:
  contents: read
jobs:
  analyses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_ext
          python tools/secondary_analyses.py study_d/results study_e/results --out SECONDARY_ANALYSES_D_E.md
          cat SECONDARY_ANALYSES_D_E.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SECONDARY_ANALYSES
          path: SECONDARY_ANALYSES_D_E.md
