# Study E evaluation run (refuses unless study_e is FROZEN and hashes match).
name: Gatekeeper Study E run
on:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated targets (empty = all)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: E1_pyyaml
            python: "3.12"
            os: ubuntu-24.04
          - target: E2_packaging
            python: "3.12"
            os: ubuntu-24.04
          - target: E3_databricks
            python: "3.11"
            os: ubuntu-24.04
          - target: K1_trino
            python: "3.12"
            os: ubuntu-24.04
          - target: K2_tomlkit
            python: "3.12"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      SELECTED: ${{ inputs.only == '' || contains(inputs.only, matrix.target) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ env.SELECTED == 'true' }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: ${{ env.SELECTED == 'true' }}
        with:
          python-version: ${{ matrix.python }}
      - name: Freeze check
        if: ${{ env.SELECTED == 'true' }}
        run: |
          python -c "import json,sys;c=json.load(open('study_e/config_study_e.json'));sys.exit(0 if c.get('status')=='FROZEN' else 'not FROZEN')"
          python tools/freeze_study.py verify study_e
      - name: Run
        if: ${{ env.SELECTED == 'true' }}
        run: |
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_e
          python -m pip freeze > out_e/PIP_FREEZE_before_${{ matrix.target }}.txt
          set -o pipefail
          python tools/run_study_d.py study_e/config_study_e.json ${{ matrix.target }} out_e 2>&1 | tee out_e/log_${{ matrix.target }}.txt
          python -m pip freeze > out_e/PIP_FREEZE_after_${{ matrix.target }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && env.SELECTED == 'true' }}
        with:
          name: STUDY_E_${{ matrix.target }}
          path: out_e
