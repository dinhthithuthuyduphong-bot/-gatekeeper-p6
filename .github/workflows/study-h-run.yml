# Study H evaluation run (refuses unless study_h is FROZEN and hashes match).
name: Gatekeeper Study H run
on: workflow_dispatch
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Freeze check
        run: |
          python -c "import json,sys;c=json.load(open('study_h/config_study_h.json'));sys.exit(0 if c.get('status')=='FROZEN' else 'not FROZEN')"
          python tools/freeze_study.py verify study_h
      - name: Run and analyse
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_h
          python -m pip freeze > out_h/PIP_FREEZE.txt
          python tools/run_study_h.py study_h/config_study_h.json out_h 2>&1 | tee out_h/log.txt
          python tools/analyze_study_h.py study_h/config_study_h.json out_h/RESULT_H1_rare.json out_h/STUDY_H_RESULTS.md
          cat out_h/STUDY_H_RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: STUDY_H
          path: out_h
