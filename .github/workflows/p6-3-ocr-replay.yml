      - name: Build legacy runtime and all three complete source arms
        timeout-minutes: 13
        shell: bash
        run: |
          set -euo pipefail
          timeout 720 docker build --platform linux/amd64 --progress plain -t gk-p6-3:local p63_src 2>&1 | tee P6_3_REMOTE_OUTPUT/build.log
          docker image inspect gk-p6-3:local > P6_3_REMOTE_OUTPUT/built-image.json
      - name: Run six isolated containers and compare exact P4 test outcomes
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          timeout 660 python3 -B p63_src/run_containers.py
      - name: Clean up stopped or interrupted research containers
        if: always()
        shell: bash
        run: |
          docker ps -aq --filter label=gk-phase=p63 | xargs -r docker rm -f
      - name: Preserve reports and setup failure logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: P6_3_REMOTE_OUTPUT
          path: P6_3_REMOTE_OUTPUT/
          retention-days: 3
          if-no-files-found: warn
