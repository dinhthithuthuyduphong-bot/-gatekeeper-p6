name: Gatekeeper Study I - zero-cost target validation

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: sqlalchemy
            python: "3.12.14"
            os: ubuntu-24.04
          - target: networkx
            python: "3.8.20"
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize evidence before runtime setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/study-i-evidence"
          printf 'target=%s\nrequested_python=%s\ncommit=%s\nrun_id=%s\nattempt=%s\n' \
            '${{ matrix.target }}' '${{ matrix.python }}' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            | tee "$RUNNER_TEMP/study-i-evidence/run-context.txt"
          uname -a | tee "$RUNNER_TEMP/study-i-evidence/runner.txt"
          cat /etc/os-release >> "$RUNNER_TEMP/study-i-evidence/runner.txt"
      - name: Set up Python for SQLAlchemy
        if: matrix.target != 'networkx'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv for the exact historical Python runtime
        if: matrix.target == 'networkx'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.4"
          enable-cache: "false"
      - name: Install Python 3.8.20 for NetworkX
        if: matrix.target == 'networkx'
        shell: bash
        run: |
          set -euo pipefail
          uv --version | tee "$RUNNER_TEMP/study-i-evidence/uv-version.txt"
          uv python install '${{ matrix.python }}' 2>&1 | tee "$RUNNER_TEMP/study-i-evidence/python-install.log"
          uv venv --no-project --managed-python --python '${{ matrix.python }}' \
            "$RUNNER_TEMP/study-i-networkx-venv" 2>&1 | tee "$RUNNER_TEMP/study-i-evidence/venv-create.log"
          printf '%s\n' "$RUNNER_TEMP/study-i-networkx-venv/bin" >> "$GITHUB_PATH"
      - name: Install pinned local-test dependencies
        shell: bash
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          set -euo pipefail
          python -c 'import os, sys; print(sys.version); print(sys.executable); actual = ".".join(map(str, sys.version_info[:3])); assert actual == os.environ["EXPECTED_PYTHON"], (actual, os.environ["EXPECTED_PYTHON"])' \
            2>&1 | tee "$RUNNER_TEMP/study-i-evidence/python-runtime.log"
          if [ '${{ matrix.target }}' = 'networkx' ]; then
            uv pip install --python "$RUNNER_TEMP/study-i-networkx-venv/bin/python" \
              -r study_i/requirements-networkx.txt 2>&1 | tee "$RUNNER_TEMP/study-i-evidence/install.log"
            uv pip freeze --python "$RUNNER_TEMP/study-i-networkx-venv/bin/python" | tee "$RUNNER_TEMP/study-i-evidence/environment.txt"
          else
            python -m pip install -r study_i/requirements-${{ matrix.target }}.txt 2>&1 | tee "$RUNNER_TEMP/study-i-evidence/install.log"
            python -m pip freeze | tee "$RUNNER_TEMP/study-i-evidence/environment.txt"
          fi
      - name: Reproduce upstream tests and generator diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -u study_i/run.py ${{ matrix.target }} --output "$RUNNER_TEMP/study-i-evidence/run" 2>&1 | tee "$RUNNER_TEMP/study-i-evidence/execution.log"
          python -u study_i/statelessness.py ${{ matrix.target }} --results "$RUNNER_TEMP/study-i-evidence/run" 2>&1 | tee "$RUNNER_TEMP/study-i-evidence/statelessness.log"
      - name: Record final job state even if setup failed
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/study-i-evidence"
          printf 'status_before_upload=%s\n' '${{ job.status }}' | tee "$RUNNER_TEMP/study-i-evidence/job-status.txt"
      - name: Preserve raw evidence, including failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: study-i-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/study-i-evidence/
            !${{ runner.temp }}/study-i-evidence/run/work/**
          if-no-files-found: error
          retention-days: 30

  audit:
    needs: reproduce
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Initialize audit evidence
        shell: bash
        run: |
          mkdir -p audited
          printf 'commit=%s\nrun_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" | tee audited/run-context.txt
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: study-i-*
          path: downloaded
      - name: Audit all observations and the complete four-cell family
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audited/inputs
          cp -R downloaded/study-i-sqlalchemy/run audited/inputs/sqlalchemy
          cp -R downloaded/study-i-networkx/run audited/inputs/networkx
          python study_i/verify.py --results audited/inputs --output audited/family 2>&1 | tee audited/verification.log
          cat audited/family/FAMILY_RESULT.md >> "$GITHUB_STEP_SUMMARY"
      - name: Record final audit state
        if: always()
        shell: bash
        run: |
          mkdir -p audited
          printf 'status_before_upload=%s\n' '${{ job.status }}' | tee audited/job-status.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: study-i-verified
          path: audited/
          if-no-files-found: error
          retention-days: 30
