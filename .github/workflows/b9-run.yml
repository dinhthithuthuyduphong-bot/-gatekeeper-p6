# B9 runs (paid, after 31/10).  Keys come from repository secrets; cassettes make every
# run replayable without paying again.
name: Gatekeeper B9 run
on:
  workflow_dispatch:
    inputs:
      target: {description: "D1_py_ecc, D2_cerberus, D3_speckit, D4_openfeature, D5_pycubrid or A1_speckit_catalog", required: true, default: "D1_py_ecc"}
      model: {description: "deepseek-flash or gemini-3.1-flash-lite", required: true, default: "deepseek-flash"}
      mode: {description: "record (paid) or replay", required: true, default: "replay"}
permissions:
  contents: read
  actions: read
jobs:
  b9:
    runs-on: ${{ inputs.target == 'D2_cerberus' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.target == 'D2_cerberus' && '3.8' || '3.12' }}
      - name: Verify freeze
        run: python tools/freeze_study.py verify study_d
      - name: Refuse a second paid record run for the same target and model
        if: ${{ inputs.mode == 'record' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=B9_RECORD_${{ inputs.target }}_${{ inputs.model }}" --jq '.total_count')
          if [ "$n" != "0" ]; then
            echo "::error::a paid record run already exists for this target/model; use mode=replay"
            exit 1
          fi
      - name: Run B9
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_b9
          python tools/run_b9.py study_d/b9_config.json study_d/config_study_d.json ${{ inputs.target }} ${{ inputs.model }} out_b9 ${{ inputs.mode }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ inputs.mode == 'record' && 'B9_RECORD_' || 'B9_REPLAY_' }}${{ inputs.target }}_${{ inputs.model }}
          path: out_b9
