# Proposed replacement. Zero-cost preflight; paid B9 remains on REVIEW_HOLD.
name: Gatekeeper B9 run
on:
  workflow_dispatch:
    inputs:
      target: {description: "D1_py_ecc, D2_cerberus, D3_speckit, D4_openfeature, D5_pycubrid or A1_speckit_catalog", required: true, default: "D1_py_ecc"}
      model: {description: "deepseek-flash, gemini-3.1-flash-lite, vertex-gemini-flash, vertex-gemini-pro", required: true, default: "deepseek-flash"}
      mode: {description: "record (paid, currently on hold) or replay", required: true, default: "replay"}
      config: {description: "B9 config (study_d/b9_config.json or study_f/b9_config_f.json)", required: true, default: "study_d/b9_config.json"}
permissions:
  contents: read
  actions: read
concurrency:
  group: b9-${{ inputs.target }}-${{ inputs.model }}
  cancel-in-progress: false
jobs:
  b9:
    runs-on: ${{ inputs.target == 'D2_cerberus' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      B9_CONFIG: ${{ inputs.config }}
      B9_TARGET: ${{ inputs.target }}
      B9_MODEL: ${{ inputs.model }}
      B9_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ inputs.target == 'D2_cerberus' && '3.8' || '3.12' }}
      - name: Verify both frozen studies and pre-B9 review gate (no API calls)
        run: |
          python tools/preflight_b9.py \
            --config "$B9_CONFIG" --target "$B9_TARGET" \
            --model "$B9_MODEL" --mode "$B9_MODE"
      - name: Refuse a second paid record run for the same target and model
        if: ${{ inputs.mode == 'record' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=B9_RECORD_${B9_TARGET}_${B9_MODEL}" --jq '.total_count')
          if [ "$n" != "0" ]; then
            echo "::error::a paid record run already exists for this target/model; use mode=replay"
            exit 1
          fi
      - name: Google Cloud auth (Vertex AI models only)
        if: ${{ startsWith(inputs.model, 'vertex-') }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        if: ${{ startsWith(inputs.model, 'vertex-') }}
        run: |
          t="$(gcloud auth print-access-token)"; echo "::add-mask::$t"; echo "GOOGLE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
      - name: Run B9
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_b9
          python tools/run_b9.py "$B9_CONFIG" study_d/config_study_d.json \
            "$B9_TARGET" "$B9_MODEL" out_b9 "$B9_MODE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ inputs.mode == 'record' && 'B9_RECORD_' || 'B9_REPLAY_' }}${{ inputs.target }}_${{ inputs.model }}
          path: out_b9
