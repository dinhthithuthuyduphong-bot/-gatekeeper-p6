      - name: Build isolated source snapshots and fixed dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          timeout 840 docker build --platform linux/amd64 --progress plain --build-arg PROFILE="$PROFILE" -t gk-p7-0:local p70_src 2>&1 | tee P7_0_REMOTE_OUTPUT/build.log
          docker image inspect gk-p7-0:local > P7_0_REMOTE_OUTPUT/built-image.json
      - name: Replay upstream before, official and generated arms twice
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          timeout 660 python3 -B p70_src/run_containers.py
      - name: Final cleanup and absence check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p P7_0_REMOTE_OUTPUT
          docker ps -aq --filter label=gk-phase=p70 | xargs -r docker rm -f
          docker ps -aq --filter label=gk-phase=p70 > P7_0_REMOTE_OUTPUT/final-cleanup.txt
          test ! -s P7_0_REMOTE_OUTPUT/final-cleanup.txt
      - name: Preserve all receipts and failure logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: P7_0_${{ matrix.profile }}_REMOTE_OUTPUT
          path: P7_0_REMOTE_OUTPUT/
          retention-days: 7
          if-no-files-found: error
