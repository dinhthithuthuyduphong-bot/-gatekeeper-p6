# Public development oracle; no model API, company data, paper or repository secrets.
# PASS means expected benefit/regression vectors reproduced, not skill admission.
name: Gatekeeper P7.1 independent oracle pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gatekeeper-p71-oracle-pilot
  cancel-in-progress: false
jobs:
  oracle-pilot:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: [upstream_oracle, frozen_skill_transfer]
