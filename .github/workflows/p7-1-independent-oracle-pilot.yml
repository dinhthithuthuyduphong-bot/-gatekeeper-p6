      - name: Build isolated source packages and fixed dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          timeout 840 docker build --platform linux/amd64 --progress plain --build-arg PROFILE="$PROFILE" -t gk-p7-1:local p71_src 2>&1 | tee P7_1_REMOTE_OUTPUT/build.log
          docker image inspect gk-p7-1:local > P7_1_REMOTE_OUTPUT/built-image.json
      - name: Reproduce declared oracle vectors twice in fresh containers
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          timeout 660 python3 -B p71_src/run_containers.py
      - name: Final cleanup and absence check
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p P7_1_REMOTE_OUTPUT
          docker ps -aq --filter label=gk-phase=p71 | xargs -r docker rm -f
          docker ps -aq --filter label=gk-phase=p71 > P7_1_REMOTE_OUTPUT/final-cleanup.txt
          test ! -s P7_1_REMOTE_OUTPUT/final-cleanup.txt
      - name: Preserve all receipts and failure logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: P7_1_${{ matrix.profile }}_REMOTE_OUTPUT
          path: P7_1_REMOTE_OUTPUT/
          retention-days: 14
          if-no-files-found: error
