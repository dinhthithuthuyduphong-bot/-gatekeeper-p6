# Study G: read-only applicability scan of the none-identity skill on the harmful-side candidates.
name: Gatekeeper Study G applicability scan
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          set -euo pipefail
          python tools/applicability_scan_ext.py study_g/candidates_harm_scan.json out_gs study_g/skills/none-identity.json
          cat out_gs/APPLICABILITY_SCAN.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: STUDY_G_SCAN
          path: out_gs
