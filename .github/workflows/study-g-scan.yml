# Study G: read-only applicability scan of the none-identity skill on the harmful-side candidates.
name: Gatekeeper Study G applicability scan
on: workflow_dispatch
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          set -euo pipefail
          python tools/applicability_scan_ext.py study_g/candidates_harm_scan.json out_gs study_g/skills/none-identity.json
          cat out_gs/APPLICABILITY_SCAN.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: STUDY_G_SCAN
          path: out_gs
