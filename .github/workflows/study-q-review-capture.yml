# Study Q amendment Q-A1 (study_q/AMENDMENTS.md): re-run the HQ1 units exactly as the stream did, but keep every
# per-input outcome, the inputs' sources and the patch text, for the manual review of contract regressions.
# Same seed as the stream (drand, pinned to the original freeze hash).  One job per instance.
name: Gatekeeper Study Q review capture (amendment Q-A1)
on:
  workflow_dispatch:
    inputs:
      only: {description: "optional comma-separated subset of study_q/QA1_TARGETS.json (empty = all)", default: ""}
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      seed: ${{ steps.m.outputs.seed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          python tools/freeze_study.py verify study_q
          python -c "import json,sys;c=json.load(open('study_q/config_study_q.json'));sys.exit(0 if 'Q-A1' in c.get('amendments_applied',[]) else 'amendment Q-A1 not applied')"
      - id: m
        env:
          ONLY: ${{ inputs.only }}
        run: |
          python - <<'PY'
          import hashlib, json, os, re, sys
          sys.path.insert(0, 'tools')
          from run_study_d import drand_seed
          cfg = json.load(open('study_q/config_study_q.json'))
          seed = drand_seed(cfg['seed_freeze_sha256'], cfg['seed_time_utc'])['seed']
          ids = json.load(open('study_q/QA1_TARGETS.json'))['instances']
          only = [x.strip('"\'') for x in re.split(r'[\s,;]+', os.environ.get('ONLY', '')) if x.strip('"\'')]
          sel = only or ids
          unknown = sorted(set(sel) - set(ids))
          if unknown:
              raise SystemExit('not Q-A1 targets: %s' % unknown)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('matrix=' + json.dumps({'iid': sel}) + '\n')
              f.write('seed=%s\n' % seed)
          print(len(sel), 'instances; seed', seed)
          PY
  one:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Google Cloud auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        run: |
          t="$(gcloud auth print-access-token)"; echo "::add-mask::$t"; echo "GOOGLE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
          pip install -q google-auth requests
          echo "GK_TOKEN_CMD=python $GITHUB_WORKSPACE/tools/fresh_gcp_token.py" >> "$GITHUB_ENV"
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p out_r
          python -u tools/q_review_capture.py "${{ matrix.iid }}" study_q/evidence/VERIFIED.json study_q/evidence/POOL.jsonl.gz "${{ needs.plan.outputs.seed }}" research_closure/pilot/models.json out_r 2>&1 | tee out_r/log.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: R_${{ matrix.iid }}
          path: out_r
