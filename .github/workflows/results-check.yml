# Re-derive the committed Study D/E decision tables from the committed raw results.
name: Gatekeeper results check
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - shell: bash
        run: |
          set -euo pipefail
          python tools/results_check.py | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/unified_comparison.py study_d/results study_e/results study_g/results | tee -a "$GITHUB_STEP_SUMMARY"
          python tools/cost_breakeven.py study_d/results study_e/results study_g/results | tee -a "$GITHUB_STEP_SUMMARY"
