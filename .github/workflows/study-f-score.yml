# Study F: held-out scoring of every end state and the B9 + Gatekeeper condition (no paid calls).
# Needs the recorded B9 outputs committed under study_d/b9_results and study_f/b9_results.
name: Gatekeeper Study F held-out scoring
on: workflow_dispatch
permissions:
  contents: read
jobs:
  score:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: D1_py_ecc
            python: "3.12"
            os: ubuntu-24.04
          - target: D2_cerberus
            python: "3.8"
            os: ubuntu-22.04
          - target: D3_speckit
            python: "3.12"
            os: ubuntu-24.04
          - target: D4_openfeature
            python: "3.12"
            os: ubuntu-24.04
          - target: D5_pycubrid
            python: "3.12"
            os: ubuntu-24.04
          - target: A1_speckit_catalog
            python: "3.12"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - shell: bash
        run: |
          set -euo pipefail
          python tools/freeze_study.py verify study_f
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_f
          python tools/score_heldout.py study_f/config_study_f.json ${{ matrix.target }} out_f --b9 study_d/b9_results study_f/b9_results 2>&1 | tee out_f/log_${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: STUDY_F_${{ matrix.target }}
          path: out_f
