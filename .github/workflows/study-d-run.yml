# Study D evaluation run.  Refuses unless study_d is FROZEN and every frozen hash matches.
name: Gatekeeper Study D run
on:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated targets to run (empty = all); used after an amendment"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: D1_py_ecc
            python: "3.12"
            os: ubuntu-24.04
          - target: D2_cerberus
            python: "3.8"
            os: ubuntu-22.04
          - target: D3_speckit
            python: "3.12"
            os: ubuntu-24.04
          - target: A1_speckit_catalog
            python: "3.12"
            os: ubuntu-24.04
          - target: D4_openfeature
            python: "3.12"
            os: ubuntu-24.04
          - target: D5_pycubrid
            python: "3.12"
            os: ubuntu-24.04
          - target: C1_jsonschema
            python: "3.12"
            os: ubuntu-24.04
          - target: C2_voluptuous
            python: "3.12"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    # 'matrix' is not allowed in a job-level `if`; selection is applied to every step instead.
    env:
      SELECTED: ${{ inputs.only == '' || contains(inputs.only, matrix.target) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ env.SELECTED == 'true' }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ env.SELECTED == 'true' }}
        with:
          python-version: ${{ matrix.python }}
      - name: Freeze check and hash verification
        if: ${{ env.SELECTED == 'true' }}
        run: |
          python -c "import json,sys;c=json.load(open('study_d/config_study_d.json'));sys.exit(0 if c.get('status')=='FROZEN' else '::error::Study D is not FROZEN')"
          python tools/freeze_study.py verify study_d
      - name: Run
        if: ${{ env.SELECTED == 'true' }}
        run: |
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_d
          python -m pip freeze > out_d/PIP_FREEZE_before_${{ matrix.target }}.txt
          set -o pipefail
          python tools/run_study_d.py study_d/config_study_d.json ${{ matrix.target }} out_d 2>&1 | tee out_d/log_${{ matrix.target }}.txt
          python -m pip freeze > out_d/PIP_FREEZE_after_${{ matrix.target }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() && env.SELECTED == 'true' }}
        with:
          name: STUDY_D_${{ matrix.target }}
          path: out_d
