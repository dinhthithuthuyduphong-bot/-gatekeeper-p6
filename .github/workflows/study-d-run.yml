# Study D evaluation run.  Refuses unless study_d is FROZEN and every frozen hash matches.
name: Gatekeeper Study D run
on: workflow_dispatch
permissions:
  contents: read
jobs:
  target:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: D1_py_ecc
            python: "3.12"
            os: ubuntu-24.04
          - target: D2_cerberus
            python: "3.8"
            os: ubuntu-22.04
          - target: C1_jsonschema
            python: "3.12"
            os: ubuntu-24.04
          - target: C2_voluptuous
            python: "3.12"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Freeze check and hash verification
        run: |
          python -c "import json,sys;c=json.load(open('study_d/config_study_d.json'));sys.exit(0 if c.get('status')=='FROZEN' else '::error::Study D is not FROZEN')"
          python tools/freeze_study.py verify study_d
      - name: Run
        run: |
          python -m pip install -q "pytest==8.3.5"
          mkdir -p out_d
          set -o pipefail
          python tools/run_study_d.py study_d/config_study_d.json ${{ matrix.target }} out_d 2>&1 | tee out_d/log_${{ matrix.target }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: STUDY_D_${{ matrix.target }}
          path: out_d
