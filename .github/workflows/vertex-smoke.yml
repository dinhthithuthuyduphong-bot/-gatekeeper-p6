# Infrastructure smoke test (NOT study data): a handful of tiny requests per model, to check the endpoint, the quota
# and the cost per token.  Spends a fraction of a cent; afterwards read Billing > Reports > Credits to see which credit paid.
name: Gatekeeper Vertex smoke test
on:
  workflow_dispatch:
    inputs:
      config:
        description: 'B9 config listing the models'
        default: 'study_f/b9_config_f.json'
      burst:
        description: 'requests per model'
        default: '5'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Google Cloud auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        run: |
          t="$(gcloud auth print-access-token)"; echo "::add-mask::$t"; echo "GOOGLE_OAUTH_TOKEN=$t" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
      - name: Smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p out_smoke
          python tools/vertex_smoke.py "${{ inputs.config }}" out_smoke --burst "${{ inputs.burst }}" | tee out_smoke/log.txt
          cat out_smoke/VERTEX_SMOKE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: VERTEX_SMOKE
          path: out_smoke
