# Infrastructure smoke test (NOT study data): a handful of tiny requests per model, to check the endpoint, the quota
# and the cost per token.  Spends a fraction of a cent; afterwards read Billing > Reports > Credits to see which credit paid.
name: Gatekeeper Vertex smoke test
on:
  workflow_dispatch:
    inputs:
      config:
        description: 'B9 config listing the models'
        default: 'study_f/b9_config_f.json'
      burst:
        description: 'requests per model'
        default: '5'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Google Cloud auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Vertex access token
        run: |
          echo "GOOGLE_OAUTH_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT }}" >> "$GITHUB_ENV"
      - name: Smoke test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p out_smoke
          python tools/vertex_smoke.py "${{ inputs.config }}" out_smoke --burst "${{ inputs.burst }}" | tee out_smoke/log.txt
          cat out_smoke/VERTEX_SMOKE.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: VERTEX_SMOKE
          path: out_smoke
