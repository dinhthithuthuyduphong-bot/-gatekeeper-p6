# Post-hoc reach-vs-effect diagnostic on the frozen Studies D/E (0 cost; skill never applied).
name: Gatekeeper coverage reach
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reach:
    strategy:
      fail-fast: false
      matrix:
        include:
          - study: study_d
            target: D1_py_ecc
            python: "3.12"
            os: ubuntu-24.04
          - study: study_d
            target: D2_cerberus
            python: "3.8"
            os: ubuntu-22.04
          - study: study_d
            target: D3_speckit
            python: "3.12"
            os: ubuntu-24.04
          - study: study_d
            target: D5_pycubrid
            python: "3.12"
            os: ubuntu-24.04
          - study: study_d
            target: C1_jsonschema
            python: "3.12"
            os: ubuntu-24.04
          - study: study_d
            target: C2_voluptuous
            python: "3.12"
            os: ubuntu-24.04
          - study: study_e
            target: E1_pyyaml
            python: "3.12"
            os: ubuntu-24.04
          - study: study_e
            target: E2_packaging
            python: "3.12"
            os: ubuntu-24.04
          - study: study_e
            target: E3_databricks
            python: "3.11"
            os: ubuntu-24.04
          - study: study_e
            target: K1_trino
            python: "3.12"
            os: ubuntu-24.04
          - study: study_e
            target: K2_tomlkit
            python: "3.12"
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p out_r
          python tools/coverage_reach.py ${{ matrix.study }}/config_${{ matrix.study }}.json ${{ matrix.target }} out_r 2>&1 | tee out_r/log_${{ matrix.target }}.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: REACH_${{ matrix.target }}
          path: out_r
